/* navbar */

.subscribe-box img{

    height:140px;

.subscribe-box h1{

.subscribe-box p{

/* compteur */

.counter{

.counter h2{

    border:none;

    border-radius:50px;

    font-size:18px;

    font-weight:bold;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(
    270deg,
    #ff0000,
    #ff4d4d,
    #ff0000);

    transition:0.3s;
}

.subscribe-btn:hover{

    transform:scale(1.05);
}

/* footer */

footer{

    margin-top:80px;

    text-align:center;

    padding:30px;

    color:#aaa;
}

/* animations */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes gradientMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://xfufmbotgnzoinojrwlu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Yic1JgOXTwPsBk46JzGRFQ_h2hTvsmI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// Créer ou récupérer un identifiant anonyme
function getVisitorId() {

    let visitorId =
    localStorage.getItem("suhox_visitor_id");

    if (!visitorId) {

        visitorId =
        crypto.randomUUID();

        localStorage.setItem(
            "suhox_visitor_id",
            visitorId
        );

    }

    return visitorId;
}


// Enregistrer la visite
async function enregistrerVisite() {

    const visitorId =
    getVisitorId();

    const page =
    window.location.pathname;

    const {
        error
    } =
    await supabaseClient
    .from("analytics_visits")
    .insert({

        visitor_id:
        visitorId,

        page:
        page

    });

    if (error) {

        console.error(
            "Erreur Analytics :",
            error
        );

    }

}


// Lancer le suivi
enregistrerVisite();

</script>
