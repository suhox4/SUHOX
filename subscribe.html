<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S'abonner - SUHOX_</title>

<link rel="icon" href="8caad655-b47e-44da-b65c-c3bf5e8be028.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ===== BODY ===== */

body {

    margin: 0;

    font-family: Arial, sans-serif;

    color: white;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: linear-gradient(
        135deg,
        #000000 0%,
        #120000 30%,
        #2a0000 55%,
        #5c0000 80%,
        #ff0000 100%
    );

    background-size: 400% 400%;

    animation:
    fadeIn 1s ease,
    gradientMove 12s ease infinite;

    overflow-x: hidden;
}

/* ===== ANIMATIONS ===== */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

/* ===== NAVBAR ===== */

.navbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding: 18px 0;

    background: rgba(0,0,0,0.65);

    backdrop-filter: blur(12px);

    display: flex;
    justify-content: center;
    gap: 40px;

    z-index: 9999;
}

.navbar a {

    color: white;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    transition: 0.3s;
}

.navbar a:hover {

    color: red;

    transform: scale(1.1);
}

.active {
    color: red !important;
}

/* ===== BOX ===== */

.subscribe-box {

    margin-top: 140px;

    width: 360px;

    padding: 40px;

    border-radius: 25px;

    background: rgba(255,255,255,0.06);

    backdrop-filter: blur(18px);

    text-align: center;

    box-shadow:
        0 0 30px rgba(255,0,0,0.15);

    transition: 0.3s;
}

.subscribe-box:hover {

    transform: translateY(-8px);

    box-shadow:
        0 0 35px rgba(255,0,0,0.35);
}

/* ===== IMAGE ===== */

.subscribe-box img {

    width: 140px;
    height: 140px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid red;

    box-shadow:
        0 0 25px rgba(255,0,0,0.8);

    transition: 0.3s;
}

.subscribe-box img:hover {

    transform: scale(1.05);
}

/* ===== TITRE ===== */

.subscribe-box h1 {

    margin-top: 25px;

    font-size: 38px;
}

.subscribe-box p {

    color: #ccc;

    line-height: 1.7;
}

/* ===== COMPTEUR ===== */

.compteur {

    width: 280px;
    height: 95px;

    margin: 30px auto;

    overflow: hidden;

    border-radius: 15px;

    background: rgba(255,255,255,0.05);

    backdrop-filter: blur(10px);

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        0 0 20px rgba(255,0,0,0.2);
}

.compteur iframe {

    width: 420px;
    height: 120px;

    border: none;

    transform:
    translate(-5px,-10px)
    scale(1.05);
}

/* ===== BOUTON ===== */

.subscribe-btn {

    padding: 16px 38px;

    border: none;

    border-radius: 50px;

    font-size: 20px;
    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
    linear-gradient(
        270deg,
        #ff0000,
        #ff4d4d,
        #ff0000
    );

    box-shadow:
        0 0 25px rgba(255,0,0,0.8);

    transition: 0.3s;

    position: relative;

    overflow: hidden;
}

.subscribe-btn:hover {

    transform: scale(1.08);
}

.subscribe-btn::before {

    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 100%;

    background:
    linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.5),
        transparent
    );

    transition: 0.5s;
}

.subscribe-btn:hover::before {

    left: 100%;
}

/* ===== NOTIFICATION ===== */

#notif {

    position: fixed;

    top: 20px;
    right: 20px;

    background: rgba(0,0,0,0.85);

    color: #00ff88;

    padding: 15px 25px;

    border-radius: 12px;

    font-weight: bold;

    opacity: 0;

    transform: translateY(-20px);

    transition: 0.4s;

    z-index: 999999;
}

#notif.show {

    opacity: 1;

    transform: translateY(0);
}

/* ===== FOOTER ===== */

footer {

    margin-top: auto;

    padding: 35px;

    text-align: center;

    color: rgba(255,255,255,0.7);
}

/* ===== RESPONSIVE ===== */

@media (max-width: 768px) {

    .navbar {

        gap: 15px;

        flex-wrap: wrap;
    }

    .navbar a {

        font-size: 14px;
    }

    .subscribe-box {

        width: 85%;
    }

}

#topBtn {

    display: none;

    position: fixed;

    bottom: 25px;
    right: 25px;

    width: 50px;
    height: 50px;

    border: none;

    border-radius: 50%;

    background: red;

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 9999;

    transition: 0.3s;
}

#topBtn:hover {

    transform: scale(1.1);

    background: #ff2d2d;
}
</style>
</head>

<body>

<button id="topBtn">↑</button>

<script>

const topBtn =
document.getElementById("topBtn");

window.onscroll = () => {

    if(document.documentElement.scrollTop > 200){

        topBtn.style.display = "block";

    } else {

        topBtn.style.display = "none";
    }

};

topBtn.onclick = () => {

    window.scrollTo({

        top: 0,

        behavior: "smooth"
    });

};

</script>

<!-- notif -->

<div id="notif">

✔ Merci pour l’abonnement !

</div>

<!-- navbar -->

<nav class="navbar">

    <a href="index.html">
        Accueil
    </a>

    <a href="subscribe.html"
    class="active">

        S'abonner

    </a>

    <a href="video.html">
        Vidéos
    </a>

    <a href="a propos.html">
        À propos
    </a>

    <a href="socials.html">
        Réseaux
    </a>

</nav>

<!-- box -->

<div class="subscribe-box">

    <img
    src="8caad655-b47e-44da-b65c-c3bf5e8be028.png"
    alt="profil">

    <h1>SUHOX_</h1>

    <p>

        Rejoins la communauté gaming 🔥

    </p>

    <!-- compteur -->

    <div class="compteur">

        <iframe
        src="https://livecounts.org/compteur-youtube/UCmb4flfRx7I1F1U9bHd_y6A">
        </iframe>

    </div>

    <!-- bouton -->

    <button
    class="subscribe-btn"
    id="btn">

        🔔 S’abonner à la chaîne

    </button>

</div>

<!-- footer -->

<footer>

    <p>

        © 2026 SUHOX_ - All rights reserved

    </p>

    <p>

        Gaming • Fun • Community

    </p>

</footer>

<script>

/* ===== ABONNEMENT ===== */

const btn =
document.getElementById("btn");

const notif =
document.getElementById("notif");

let subscribed =
localStorage.getItem("subscribed")
=== "true";

updateButton();

btn.addEventListener("click", () => {

    if(!subscribed){

        window.open(
        "https://youtube.com/@salesman_gong_yoo_456?sub_confirmation=1",
        "_blank"
        );

        notif.classList.add("show");

        setTimeout(() => {

            notif.classList.remove("show");

        }, 2500);

        subscribed = true;

    }

    localStorage.setItem(
    "subscribed",
    subscribed
    );

    updateButton();

});

/* ===== UPDATE ===== */

function updateButton(){

    if(subscribed){

        btn.textContent =
        "Abonné ✔";

        btn.style.background =
        "linear-gradient(270deg,#00c853,#00e676,#00c853)";

    } else {

        btn.textContent =
        "🔔 S’abonner à la chaîne";
    }

}

</script>

</body>
</html>
