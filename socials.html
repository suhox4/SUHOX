<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Réseaux - SUHOX_</title>

<link rel="icon" href="8caad655-b47e-44da-b65c-c3bf5e8be028.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin: 0;
    padding-top: 100px;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #000000 0%,
        #120000 30%,
        #2a0000 55%,
        #5c0000 80%,
        #ff0000 100%
    );

    background-size: 400% 400%;

    animation:
    fadeIn 1s ease,
    gradientMove 12s ease infinite;

    overflow-x: hidden;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

.navbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    background: rgba(0,0,0,0.7);

    backdrop-filter: blur(12px);

    display: flex;

    justify-content: center;

    gap: 40px;

    padding: 18px 0;

    z-index: 9999;
}

.navbar a {

    color: white;

    text-decoration: none;

    font-size: 18px;

    font-weight: bold;

    transition: 0.3s;
}

.navbar a:hover {

    color: red;

    transform: scale(1.08);
}

.navbar a.active {

    color: red !important;
}

.header {

    text-align: center;

    margin-bottom: 60px;
}

.header h1 {

    font-size: 50px;

    margin-bottom: 15px;
}

.header p {

    color: #ccc;

    font-size: 18px;
}

.social-grid {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 35px;

    padding: 20px;
}

.social-card {

    width: 280px;

    padding: 35px;

    border-radius: 25px;

    background: rgba(255,255,255,0.06);

    backdrop-filter: blur(18px);

    text-align: center;

    box-shadow:
        0 0 30px rgba(255,0,0,0.15);

    transition: 0.3s;
}

.social-card:hover {

    transform:
        translateY(-10px)
        scale(1.03);

    box-shadow:
        0 0 35px rgba(255,0,0,0.35);
}

.social-card i {

    font-size: 70px;

    margin-bottom: 25px;

    color: red;

    text-shadow:
        0 0 20px red;
}

.social-card h2 {

    font-size: 30px;

    margin-bottom: 15px;
}

.social-card p {

    color: #ccc;

    line-height: 1.7;

    margin-bottom: 25px;
}

.social-btn {

    display: inline-block;

    padding: 14px 28px;

    border-radius: 50px;

    background:
    linear-gradient(
        270deg,
        #ff0000,
        #ff4d4d,
        #ff0000
    );

    color: white;

    text-decoration: none;

    font-weight: bold;

    transition: 0.3s;
}

.social-btn:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 20px red;
}

#loading {

    text-align: center;

    color: #ccc;

    font-size: 18px;

    padding: 30px;
}

#error {

    display: none;

    text-align: center;

    color: #ff7777;

    font-size: 18px;

    padding: 30px;
}

footer {

    margin-top: 80px;

    padding: 35px;

    text-align: center;

    color: rgba(255,255,255,0.7);
}

@media (max-width: 768px) {

    .navbar {

        gap: 15px;

        flex-wrap: wrap;
    }

    .navbar a {

        font-size: 14px;
    }

    .header h1 {

        font-size: 35px;
    }

    .social-card {

        width: 85%;
    }

}

#topBtn {

    display: none;

    position: fixed;

    bottom: 25px;
    right: 25px;

    width: 50px;
    height: 50px;

    border: none;

    border-radius: 50%;

    background: red;

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 9999;

    transition: 0.3s;
}

#topBtn:hover {

    transform: scale(1.1);

    background: #ff2d2d;
}

</style>

</head>

<body>

<button id="topBtn">↑</button>

<nav class="navbar">

</nav>

<div class="header">

<h1>
    Mes Réseaux 🔥
</h1>

<p>
    Rejoins-moi sur toutes mes plateformes
</p>

</div>

<div id="loading">
    Chargement des réseaux...
</div>

<div id="error">
    Impossible de charger les réseaux.
</div>

<div
    class="social-grid"
    id="socialGrid">
</div>

<footer>

<p>
    © 2026 SUHOX_ - All rights reserved
</p>

<p>
    Gaming • Fun • Community
</p>

</footer>

<script>

/* ===== SUPABASE ===== */

const SUPABASE_URL =
"https://xfufmbotgnzoinojrwlu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Yic1JgOXTwPsBk46JzGRFQ_h2hTvsmI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ===== ELEMENTS ===== */

const socialGrid =
document.getElementById(
    "socialGrid"
);

const loading =
document.getElementById(
    "loading"
);

const errorMessage =
document.getElementById(
    "error"
);


/* ===== ICÔNES ===== */

function getIcon(type) {

    const icons = {

        youtube:
        "fa-brands fa-youtube",

        discord:
        "fa-brands fa-discord",

        twitch:
        "fa-brands fa-twitch",

        instagram:
        "fa-brands fa-instagram",

        twitter:
        "fa-brands fa-x-twitter",

        tiktok:
        "fa-brands fa-tiktok",

        facebook:
        "fa-brands fa-facebook"

    };

    return icons[type] ||
    "fa-solid fa-link";

}


/* ===== CHARGER LES RÉSEAUX ===== */

async function chargerReseaux() {

    loading.style.display =
    "block";

    errorMessage.style.display =
    "none";

    socialGrid.innerHTML =
    "";


    const {
        data,
        error
    } =
    await supabaseClient
    .from("socials")
    .select("*")
    .order(
        "ordre",
        {
            ascending: true
        }
    );


    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        loading.style.display =
        "none";

        errorMessage.style.display =
        "block";

        return;

    }


    loading.style.display =
    "none";


    if (
        !data ||
        data.length === 0
    ) {

        errorMessage.textContent =
        "Aucun réseau disponible.";

        errorMessage.style.display =
        "block";

        return;

    }


    data.forEach(
        reseau => {

            const card =
            document.createElement(
                "div"
            );

            card.className =
            "social-card";


            const icon =
            getIcon(
                reseau.icone
            );


            card.innerHTML = `

                <i class="${icon}"></i>

                <h2>
                    ${escapeHTML(
                        reseau.nom
                    )}
                </h2>

                <p>
                    ${escapeHTML(
                        reseau.description ||
                        "Retrouve-moi sur cette plateforme."
                    )}
                </p>

                <a
                    class="social-btn"
                    href="${escapeAttribute(
                        reseau.url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer">

                    Rejoindre

                </a>

            `;


            socialGrid.appendChild(
                card
            );

        }
    );

}


/* ===== SECURITE HTML ===== */

function escapeHTML(text) {

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    text || "";

    return div.innerHTML;

}


function escapeAttribute(text) {

    return String(
        text || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


/* ===== BOUTON RETOUR EN HAUT ===== */

const topBtn =
document.getElementById(
    "topBtn"
);


window.onscroll = () => {

    if (
        document.documentElement.scrollTop >
        200
    ) {

        topBtn.style.display =
        "block";

    } else {

        topBtn.style.display =
        "none";

    }

};


topBtn.onclick = () => {

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

};


/* ===== LANCEMENT ===== */

chargerReseaux();

</script>

</body>

</html>
